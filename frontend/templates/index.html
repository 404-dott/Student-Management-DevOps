<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=login.html">
    <title>Redirecting - EduManager</title>
</head>
<body>
    <script>
        // Redirect to dashboard if session exists, else login
        const user = localStorage.getItem('admin_user');
        if (user) {
            window.location.href = 'dashboard.html';
        } else {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
