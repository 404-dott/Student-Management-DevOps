<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Student Management Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card shadow-lg">
            <div class="auth-header text-center">
                <div class="brand-icon mb-3">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h3 class="fw-bold mb-1 text-white">EduManager DevOps</h3>
                <p class="text-white-50 small mb-0">Multi-Tier Containerized Student Management</p>
            </div>

            <div class="auth-content p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="badge-devops me-2">
                        <i class="fa-brands fa-docker text-primary me-1"></i> Docker &bull; Flask &bull; MySQL
                    </div>
                </div>

                <h4 class="fw-bold text-dark mb-1">Admin Sign In</h4>
                <p class="text-muted small mb-4">Enter your administrative credentials to continue</p>

                <!-- Alert Message -->
                <div id="login-alert" class="alert alert-danger d-none" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>
                    <span id="alert-message">Invalid credentials</span>
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Admin Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fa-solid fa-user text-muted"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. admin" required autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fa-solid fa-lock text-muted"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                            <button class="btn btn-outline-light text-muted border border-start-0" type="button" id="toggle-password">
                                <i class="fa-regular fa-eye" id="toggle-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
                        <span>Sign In to Dashboard</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <!-- Demo Credentials helper box -->
                <div class="demo-box mt-4 p-3 rounded-3 bg-light border">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="small fw-bold text-secondary">
                            <i class="fa-solid fa-key text-warning me-1"></i> Demo Credentials
                        </span>
                        <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 fw-semibold" id="fill-demo-btn">
                            Auto-Fill
                        </button>
                    </div>
                    <div class="small text-muted font-monospace">
                        <div><strong>User:</strong> admin</div>
                        <div><strong>Pass:</strong> admin123</div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="/api/health" target="_blank" class="text-decoration-none small text-muted">
                        <i class="fa-solid fa-heart-pulse text-success me-1"></i> System Health Status
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // Auto-fill demo credentials
        document.getElementById('fill-demo-btn').addEventListener('click', function() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
        });

        // Form Submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('login-alert');
            const alertMsg = document.getElementById('alert-message');
            const btn = document.getElementById('login-btn');

            alertBox.classList.add('d-none');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Authenticating...`;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('admin_user', JSON.stringify(data.user));
                    // Redirect to dashboard (handles both Flask SSR and static Nginx serving)
                    window.location.href = window.location.pathname.endsWith('.html') ? 'dashboard.html' : '/dashboard';
                } else {
                    alertMsg.textContent = data.error || 'Authentication failed. Please verify credentials.';
                    alertBox.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = `<span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right"></i>`;
                }
            } catch (err) {
                alertMsg.textContent = 'Server connection error. Ensure backend is running.';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right"></i>`;
            }
        });
    </script>
</body>
</html>
