<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Student Management DevOps Portal</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-white bg-opacity-10 mb-3">
                <i class="fa-solid fa-graduation-cap fa-2x text-white"></i>
            </div>
            <h3 class="fw-bold mb-1">Student Management</h3>
            <p class="mb-0 text-white-50 small">Containerized Multi-Tier DevOps Architecture</p>
        </div>

        <!-- Form Body -->
        <div class="login-body-content">
            <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small" role="alert">
                <i class="fa-solid fa-circle-exclamation me-1"></i> <span id="login-alert-text"></span>
            </div>

            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small text-muted">ADMIN USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Enter username" value="admin" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label fw-semibold small text-muted mb-0">PASSWORD</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="Enter password" value="admin123" required>
                        <button class="btn btn-light border border-start-0 text-muted" type="button" id="toggle-password-btn">
                            <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm">
                    <span id="login-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    <i class="fa-solid fa-arrow-right-to-bracket" id="login-icon"></i>
                    <span>Sign In to Dashboard</span>
                </button>
            </form>

            <div class="mt-4 p-3 bg-light rounded-3 border small">
                <div class="d-flex align-items-center gap-2 text-primary fw-semibold mb-1">
                    <i class="fa-solid fa-key"></i> Default Demo Credentials
                </div>
                <div class="text-muted">Username: <strong>admin</strong> | Password: <strong>admin123</strong></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <span>Flask &bull; MySQL &bull; Nginx &bull; Docker &bull; Jenkins</span>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login Logic -->
    <script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('toggle-password-btn');
        const passInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-password-icon');

        toggleBtn.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // Login submission
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('login-alert');
        const alertText = document.getElementById('login-alert-text');
        const loginBtn = document.getElementById('login-btn');
        const spinner = document.getElementById('login-spinner');
        const loginIcon = document.getElementById('login-icon');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('d-none');
            loginBtn.disabled = true;
            spinner.classList.remove('d-none');
            loginIcon.classList.add('d-none');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alertText.textContent = data.error || 'Authentication failed. Please verify credentials.';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertText.textContent = 'Server communication error. Ensure backend is running.';
                alertBox.classList.remove('d-none');
            } finally {
                loginBtn.disabled = false;
                spinner.classList.add('d-none');
                loginIcon.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
