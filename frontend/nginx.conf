server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index login.html index.html dashboard.html;

    # Static CSS, JS, and vendor assets
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Clean UI Routes
    location = / {
        try_files /login.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    location = /dashboard {
        try_files /dashboard.html =404;
    }

    location = /students {
        try_files /students.html =404;
    }

    location = /attendance {
        try_files /attendance.html =404;
    }

    location = /student-profile {
        try_files /student-profile.html =404;
    }

    # Fallback to file, directory, or login page
    location / {
        try_files $uri $uri/ /login.html;
    }

    # Reverse proxy API requests to Flask backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
